<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Văn phòng LINHX 3D</title>
<style>#stage canvas{display:block;cursor:grab}#stage canvas:active{cursor:grabbing}</style>
</head>
<body>
<div id="stage"></div>
<script src="/vendor/three.min.js"></script>
<script src="/office-core.js"></script>
<script>
(() => {
  const O = window.Office, L = O.LAYOUT;
  O.buildUI('3d');
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;

  // ---------- Khung cảnh ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(2, devicePixelRatio));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.getElementById('stage').appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(dark ? 0x1b1a1f : 0xf6f1e7);
  const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 200);

  scene.add(new THREE.HemisphereLight(0xfff4e0, 0x9c7a58, dark ? 0.75 : 0.95));
  const sun = new THREE.DirectionalLight(0xffffff, 0.75);
  sun.position.set(-10, 22, 12); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 16, bottom: -16, near: 1, far: 60 });
  scene.add(sun);

  const wx = (x) => x - L.W / 2, wz = (y) => y - L.H / 2;
  const mats = {};
  const mat = (c, extra = {}) => (mats[c + JSON.stringify(extra)] ||= new THREE.MeshLambertMaterial({ color: c, ...extra }));
  function box(w, h, d, c, x, y, z, parent = scene, shadow = true) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c));
    m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true; parent.add(m); return m;
  }
  function cyl(rt, rb, h, c, x, y, z, parent = scene, seg = 12) {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat(c));
    m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
  }

  // sàn gỗ kẻ ván
  const floorTex = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
    for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? '#c99a69' : '#bf8f5f'; g.fillRect(0, i * 32, 256, 32); g.fillStyle = '#a97b4f'; g.fillRect(0, i * 32 + 31, 256, 1); g.fillRect((i * 97) % 256, i * 32, 1, 32); }
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(L.W / 4, L.H / 4); return t;
  })();
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(L.W, L.H), new THREE.MeshLambertMaterial({ map: floorTex }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  // thảm
  box(11.8, 0.02, 1.6, 0x7aa37a, wx(7.5), 0.01, wz(3), scene, false);
  box(6, 0.02, 4, 0x7d93c4, wx(24.6), 0.01, wz(16.6), scene, false);
  box(4.8, 0.02, 4.8, 0xd6b98c, wx(15), 0.01, wz(9), scene, false);
  // tường: sau cao, hai bên và trước thấp để nhìn vào trong
  box(L.W, 2.6, 0.3, 0xefe3cf, 0, 1.3, wz(0) - 0.15);
  box(0.3, 1.0, L.H, 0xe3d4bc, wx(0) - 0.15, 0.5, 0);
  box(0.3, 1.0, L.H, 0xe3d4bc, wx(L.W) + 0.15, 0.5, 0);
  box(L.door.x - 1.3, 0.5, 0.3, 0xe3d4bc, wx((L.door.x - 1.3) / 2), 0.25, wz(L.H) + 0.15);
  box(L.W - L.door.x - 1.3, 0.5, 0.3, 0xe3d4bc, wx((L.W + L.door.x + 1.3) / 2), 0.25, wz(L.H) + 0.15);
  for (const x of [14, 18]) { box(1.8, 1.1, 0.05, 0x9fd3ec, wx(x), 1.6, wz(0) + 0.02, scene, false); box(0.08, 1.1, 0.07, 0xf7f1e6, wx(x), 1.6, wz(0) + 0.03, scene, false); }
  // bảng trắng
  box(L.board.w, 1.2, 0.06, 0x9aa0a8, wx(L.board.x), 1.5, wz(0) + 0.04);
  box(L.board.w - 0.15, 1.05, 0.07, 0xfbfbf7, wx(L.board.x), 1.5, wz(0) + 0.05);
  // kệ sách
  const bookColors = [0xc0392b, 0x2e86c1, 0x27ae60, 0xf1c40f, 0x8e44ad, 0xe67e22, 0x16a085];
  for (const s of L.shelves) {
    box(s.w, 2.0, 0.6, 0x6e4a2f, wx(s.x), 1.0, wz(1.2) - 0.3);
    for (let r = 0; r < 3; r++) for (let i = 0; i < s.w * 5 - 2; i++)
      box(0.14, 0.42, 0.4, bookColors[(i * 3 + r * 5 + Math.floor(s.x)) % 7], wx(s.x - s.w / 2 + 0.25 + i * 0.2), 0.45 + r * 0.6, wz(1.2) - 0.08, scene, false);
  }
  // bàn làm việc: lưu màn hình để bật sáng
  const screens = new Map();
  const deskMeshes = new Map();
  function makeDesk(d) {
    const g = new THREE.Group(); g.position.set(wx(d.x), 0, wz(d.y)); scene.add(g);
    box(2.4, 0.08, 1.0, 0xa8744b, 0, 0.74, 0, g);
    for (const sx of [-1.1, 1.1]) for (const sz of [-0.4, 0.4]) box(0.07, 0.74, 0.07, 0x6e4a2f, sx, 0.37, sz, g);
    box(0.9, 0.56, 0.05, 0x2d2f36, 0, 1.12, -0.28, g);
    box(0.08, 0.3, 0.08, 0x2d2f36, 0, 0.9, -0.28, g);
    box(0.7, 0.03, 0.22, 0xd9d2c5, 0, 0.79, 0.1, g);
    const scr = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.46), new THREE.MeshBasicMaterial({ color: 0x3c4049 }));
    scr.position.set(0, 1.12, -0.25); g.add(scr);
    // ghế
    box(0.55, 0.08, 0.55, 0x4a4f5c, 0, 0.45, 1.1, g); box(0.55, 0.5, 0.07, 0x4a4f5c, 0, 0.72, 1.38, g);
    cyl(0.04, 0.04, 0.4, 0x2b2b2b, 0, 0.22, 1.1, g, 6);
    screens.set(d, scr); deskMeshes.set(d, g);
    return g;
  }
  for (const d of [...L.claudeDesks, ...L.agyDesks]) { const g = makeDesk(d); g.visible = !d.spare; }
  // bàn họp
  const m = L.meeting;
  box(m.w, 0.08, m.h, 0xe8d4b0, wx(m.x), 0.74, wz(m.y));
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) box(0.08, 0.74, 0.08, 0x6e4a2f, wx(m.x) + sx * (m.w / 2 - 0.2), 0.37, wz(m.y) + sz * (m.h / 2 - 0.2));
  // sofa + bàn trà
  box(5, 0.45, 0.9, 0xc4566a, wx(24.5), 0.3, wz(15.2)); box(5, 0.6, 0.25, 0x9c3f52, wx(24.5), 0.6, wz(14.85));
  box(0.8, 0.45, 2.6, 0xc4566a, wx(22), 0.3, wz(16.4)); box(0.8, 0.45, 2.6, 0xc4566a, wx(27), 0.3, wz(16.4));
  box(1.8, 0.35, 0.9, 0xe8d4b0, wx(24.5), 0.2, wz(16.8));
  // quầy cà phê
  box(6.6, 1.0, 0.9, 0x7b5a44, wx(4.7), 0.5, wz(18.7)); box(6.7, 0.06, 1.0, 0xe9e1d4, wx(4.7), 1.03, wz(18.7));
  box(0.7, 0.8, 0.5, 0x3a3d44, wx(2.4), 1.45, wz(18.8)); box(0.12, 0.08, 0.02, 0xe74c3c, wx(2.4), 1.6, wz(18.54));
  for (let i = 0; i < 4; i++) cyl(0.07, 0.06, 0.14, 0xffffff, wx(4.2 + i * 0.7), 1.13, wz(18.6), scene, 10);
  // cây xanh
  for (const p of L.plants) {
    cyl(0.28, 0.22, 0.5, 0xc06b46, wx(p.x), 0.25, wz(p.y));
    const leaf = new THREE.Mesh(new THREE.IcosahedronGeometry(0.55, 0), mat(0x4f9a52));
    leaf.position.set(wx(p.x), 0.95, wz(p.y)); leaf.castShadow = true; scene.add(leaf);
  }
  // nhãn khu trên sàn
  function floorLabel(text, x, y, size = 0.55) {
    const c = document.createElement('canvas'); c.width = 512; c.height = 64; const g = c.getContext('2d');
    g.font = 'bold 40px system-ui, sans-serif'; g.fillStyle = 'rgba(43,38,34,.55)'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 256, 32);
    const t = new THREE.CanvasTexture(c);
    const mm = new THREE.Mesh(new THREE.PlaneGeometry(size * 8, size), new THREE.MeshBasicMaterial({ map: t, transparent: true, depthWrite: false }));
    mm.rotation.x = -Math.PI / 2; mm.position.set(wx(x), 0.03, wz(y)); scene.add(mm);
  }
  floorLabel('THƯ VIỆN', 7.5, 3.4); floorLabel('BÀN CLAUDE', 7, 4.4); floorLabel('BÀN ANTIGRAVITY', 23, 4.4);
  floorLabel('PHÒNG HỌP', 15, 6.3); floorLabel('SOFA TRA CỨU', 24.5, 14); floorLabel('QUẦY CÀ PHÊ', 4.7, 15.4); floorLabel('CỬA', 15, 19.4);

  // ---------- Nhân vật mèo ----------
  const FUR = [0xf0a35e, 0xf3e7d3, 0x6b6b6b, 0x2f2f33, 0xc58a4a, 0xe9c79a];
  const chars = new Map();

  function textSprite(draw, w, h, scale) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const t = new THREE.CanvasTexture(c);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false, transparent: true }));
    s.renderOrder = 10; s.scale.set(scale * w / h, scale, 1);
    s.userData.redraw = (...args) => { const g = c.getContext('2d'); g.clearRect(0, 0, w, h); draw(g, ...args); t.needsUpdate = true; };
    return s;
  }
  function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

  function makeChar(a) {
    const g = new THREE.Group(); g.scale.setScalar(1.35); scene.add(g);
    const fur = FUR[a.hue], shirt = new THREE.Color(a.color).getHex();
    const body = new THREE.Group(); g.add(body);
    const torso = cyl(0.24, 0.3, 0.5, shirt, 0, 0.55, 0, body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.27, 16, 12), mat(fur)); head.position.set(0, 1.05, 0); head.castShadow = true; body.add(head);
    for (const s of [-1, 1]) {
      const ear = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.18, 4), mat(fur)); ear.position.set(s * 0.15, 1.3, 0); ear.rotation.z = -s * 0.25; body.add(ear);
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 6), mat(0x1d1b1a)); eye.position.set(s * 0.09, 1.08, 0.24); body.add(eye);
    }
    const nose = new THREE.Mesh(new THREE.SphereGeometry(0.025, 6, 4), mat(0xc2706f)); nose.position.set(0, 1.0, 0.27); body.add(nose);
    const tail = cyl(0.04, 0.05, 0.5, fur, 0, 0.55, -0.32, body, 6); tail.rotation.x = -0.7;
    const legs = [-1, 1].map((s) => box(0.12, 0.32, 0.14, 0x3b3330, s * 0.1, 0.16, 0, g));
    const arms = [-1, 1].map((s) => { const p = new THREE.Group(); p.position.set(s * 0.3, 0.75, 0); body.add(p); box(0.1, 0.34, 0.1, fur, 0, -0.17, 0, p); return p; });
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.03, 6, 24), new THREE.MeshBasicMaterial({ color: 0xf39c12 }));
    ring.rotation.x = Math.PI / 2; ring.position.y = 0.04; ring.visible = false; g.add(ring);
    const sel = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.025, 6, 28), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    sel.rotation.x = Math.PI / 2; sel.position.y = 0.05; sel.visible = false; g.add(sel);
    const label = textSprite((c, name, color) => {
      c.font = '600 30px system-ui, sans-serif'; const w = Math.min(250, c.measureText(name).width + 34);
      c.fillStyle = 'rgba(30,26,22,.78)'; rr(c, 128 - w / 2, 6, w, 44, 12); c.fill();
      c.fillStyle = color; c.fillRect(128 - w / 2 + 9, 18, 7, 20);
      c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(name, 136, 29);
    }, 256, 56, 0.3);
    label.position.y = 1.72; g.add(label); label.userData.redraw(a.name, a.color);
    const bubble = textSprite((c, glyph, state) => {
      if (!glyph) return;
      c.fillStyle = state === 'waiting' ? '#f5c04a' : state === 'error' ? '#e5534b' : 'rgba(255,255,255,.96)';
      rr(c, 8, 8, 112, 84, 22); c.fill();
      c.beginPath(); c.moveTo(52, 90); c.lineTo(76, 90); c.lineTo(64, 116); c.fill();
      c.fillStyle = state === 'error' ? '#fff' : '#2b2622'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.font = `${state === 'waiting' ? 'bold 64' : '50'}px system-ui, "Segoe UI Emoji", sans-serif`; c.fillText(glyph, 64, 52);
    }, 128, 128, 0.62);
    bubble.position.y = 2.2; g.add(bubble);
    const ch = { g, body, legs, arms, tail, ring, sel, label, bubble, glyph: null, yaw: 0 };
    chars.set(a.id, ch);
    return ch;
  }

  O.on((type, a) => {
    if (type === 'remove') { const ch = chars.get(a.id); if (ch) { scene.remove(ch.g); chars.delete(a.id); } }
    else if (!chars.has(a.id)) makeChar(a);
  });

  // vạch đỏ khi hai agent cùng sửa một file
  const clashLines = [];
  const clashMat = new THREE.LineBasicMaterial({ color: 0xe5534b });

  // ---------- Camera xoay quanh ----------
  const cam = { theta: 0, phi: 0.8, r: 38, target: new THREE.Vector3(0, 0, 1.5), goal: null };
  let drag = null;
  renderer.domElement.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, t: cam.theta, p: cam.phi }; cam.goal = null; });
  addEventListener('pointerup', () => (drag = null));
  addEventListener('pointermove', (e) => {
    if (!drag) return;
    cam.theta = drag.t - (e.clientX - drag.x) * 0.006;
    cam.phi = Math.max(0.25, Math.min(1.45, drag.p - (e.clientY - drag.y) * 0.005));
  });
  renderer.domElement.addEventListener('wheel', (e) => { e.preventDefault(); cam.r = Math.max(8, Math.min(55, cam.r * (1 + e.deltaY * 0.001))); }, { passive: false });
  let selected = null, selectedAt = 0;
  O.onSelect = (a) => { if (!a) return; selected = a.id; selectedAt = performance.now(); cam.goal = new THREE.Vector3(wx(a.x), 0, wz(a.y)); cam.r = Math.min(cam.r, 16); };

  function resize() {
    const w = innerWidth, h = innerHeight, side = w > 760 ? 320 : 0;
    renderer.setSize(w, h); camera.aspect = w / h;
    if (side) camera.setViewOffset(w + side, h, side, 0, w, h); else camera.clearViewOffset();
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();

  // ---------- Khung hình ----------
  const SCREEN = { thinking: 0x1e6b45, writing: 0x2bd16b, running: 0x2bd16b, error: 0xb32d2d, waiting: 0xd9a21b };
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; const t = now / 1000;
    O.step(dt);
    if (cam.goal) cam.target.lerp(cam.goal, 0.08);
    camera.position.set(cam.target.x + cam.r * Math.sin(cam.phi) * Math.sin(cam.theta), cam.r * Math.cos(cam.phi), cam.target.z + cam.r * Math.sin(cam.phi) * Math.cos(cam.theta));
    camera.lookAt(cam.target);

    for (const [d, scr] of screens) scr.material.color.setHex(0x3c4049);
    for (const d of [...L.claudeDesks, ...L.agyDesks]) if (d.spare) deskMeshes.get(d).visible = false;

    for (const a of O.agents.values()) {
      const ch = chars.get(a.id) || makeChar(a);
      const d = O.deskOf(a);
      if (d && d.spare) deskMeshes.get(d).visible = true;
      const seated = d && !a.walking && Math.hypot(a.x - d.x, a.y - d.y - 1.1) < 0.12;
      if (seated && SCREEN[a.state]) {
        const c = SCREEN[a.state] === 0x2bd16b && a.source === 'agy' ? 0x3d8bff : SCREEN[a.state];
        screens.get(d).material.color.setHex(Math.sin(t * 9 + a.hue) > -0.6 ? c : 0x123a2a);
      }
      ch.g.position.set(wx(a.x), seated ? 0.12 : 0, wz(a.y));
      // hướng nhìn
      const yawFor = { up: Math.PI, down: 0, left: -Math.PI / 2, right: Math.PI / 2 }[a.dir || 'down'];
      let dy = yawFor - ch.yaw; while (dy > Math.PI) dy -= 2 * Math.PI; while (dy < -Math.PI) dy += 2 * Math.PI;
      ch.yaw += dy * Math.min(1, dt * 10); ch.g.rotation.y = ch.yaw;
      // dáng đi, gõ phím, giơ tay
      const sw = a.walking ? Math.sin(t * 12) : 0;
      ch.legs[0].rotation.x = sw * 0.6; ch.legs[1].rotation.x = -sw * 0.6;
      ch.body.position.y = a.walking ? Math.abs(Math.sin(t * 12)) * 0.05 : 0;
      const typing = !a.walking && ['writing', 'running', 'thinking'].includes(a.state);
      ch.arms[0].rotation.x = typing ? -1.1 + Math.sin(t * 20) * 0.15 : -sw * 0.5;
      ch.arms[1].rotation.x = a.state === 'waiting' && !a.walking ? Math.PI * 0.95 + Math.sin(t * 6) * 0.15 : typing ? -1.1 - Math.sin(t * 20) * 0.15 : sw * 0.5;
      ch.tail.rotation.z = Math.sin(t * 3 + a.hue) * 0.4;
      ch.ring.visible = !!a.stuck;
      ch.sel.visible = selected === a.id && now - selectedAt < 4000;
      // bong bóng
      const glyph = a.walking ? '' : a.state === 'thinking' ? '.'.repeat(1 + Math.floor(t * 3) % 3) : (O.BUBBLE[a.state] || '');
      const key = glyph + a.state;
      if (ch.glyph !== key) { ch.glyph = key; ch.bubble.userData.redraw(glyph, a.state); }
      const pulse = a.state === 'waiting' ? 1 + 0.12 * Math.sin(t * 8) : 1;
      ch.bubble.scale.set(0.62 * pulse, 0.62 * pulse, 1);
      ch.g.traverse((o) => { if (o.material && o.material.opacity !== undefined && o.isSprite) o.material.opacity = a.leaving ? 0.6 : 1; });
    }
    // vạch nối cùng sửa file
    for (const l of clashLines) { scene.remove(l); l.geometry.dispose(); } clashLines.length = 0;
    for (const a of O.agents.values()) {
      const o = a.clash && O.agents.get(a.clash.with);
      if (!o || a.id > o.id) continue;
      const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(wx(a.x), 1.5, wz(a.y)), new THREE.Vector3(wx(o.x), 1.5, wz(o.y))]);
      const line = new THREE.Line(geo, clashMat); scene.add(line); clashLines.push(line);
    }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  O.connect();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
