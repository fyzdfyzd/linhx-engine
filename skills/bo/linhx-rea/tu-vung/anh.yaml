loai: anh
phien_ban: "0.1.0"
mo_ta: >
  Bộ từ vựng đóng 17 trục dùng cho rea-anh (10 trục đọc hình ảnh + 7 thành phần thị giác Bruce Block).
  Mốc (moc) dùng toạ độ chuẩn hoá [x, y] trong [0, 1] hoặc mã ô lưới 3x3 từ A1 đến C3.

