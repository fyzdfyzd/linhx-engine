  # 7 thành phần thị giác Bruce Block (The Visual Story)
  - ma: khong_gian
    cau_hoi: "Không gian thị giác (chiều sâu phối cảnh so với mặt phẳng 2D) vận hành theo tương phản hay tương đồng?"
    gia_tri:
      - tuong_phan
      - tuong_dong
    can_moc: false

  - ma: duong_net
    cau_hoi: "Hệ thống đường nét (hướng, độ cong/thẳng, độ dày) tạo sự tương phản hay tương đồng?"
    gia_tri:
      - tuong_phan
      - tuong_dong
    can_moc: false

  - ma: hinh_khoi
    cau_hoi: "Hình dáng và khối cơ bản (vuông, tròn, tam giác, hữu cơ/hình học) tương phản hay tương đồng?"
    gia_tri:
      - tuong_phan
      - tuong_dong
    can_moc: false

  - ma: sac_do
    cau_hoi: "Phân bố sắc độ sáng tối giữa các mảng/lớp tạo tương phản mạnh hay tương đồng êm?"
    gia_tri:
      - tuong_phan
      - tuong_dong
    can_moc: false

  - ma: mau
    cau_hoi: "Quan hệ màu sắc (tông màu, độ bão hoà, nóng/lạnh) vận hành theo tương phản hay tương đồng?"
    gia_tri:
      - tuong_phan
      - tuong_dong
    can_moc: false

  - ma: chuyen_dong
    cau_hoi: "Hướng động thị giác (lực hút mắt, hướng nghiêng/nhìn, vệt mờ) tạo tương phản hay tương đồng?"
    gia_tri:
      - tuong_phan
      - tuong_dong
    can_moc: false

  - ma: nhip
    cau_hoi: "Nhịp điệu lặp lại và khoảng cách giữa các yếu tố thị giác mang tính tương phản (đột ngột, biến đổi) hay tương đồng (đều đặn)?"
    gia_tri:
      - tuong_phan
      - tuong_dong
    can_moc: false
