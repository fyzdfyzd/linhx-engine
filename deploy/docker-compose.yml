# LINHX ENGINE 0.1: Frappe mong + linhx-front + tho agy tren cloud.
# Chay: cp .env.example .env ; sua .env ; docker compose up -d --build
name: linhx-engine

x-frappe: &frappe
  image: linhx-engine/frappe:0.1
  restart: unless-stopped
  volumes: [sites:/home/frappe/frappe-bench/sites, logs:/home/frappe/frappe-bench/logs]
  depends_on: [db, redis]

services:
  db:
    image: mariadb:10.6
    restart: unless-stopped
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --skip-character-set-client-handshake, --skip-innodb-read-only-compressed]
    environment: { MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}" }
    healthcheck: { test: ["CMD", "healthcheck.sh", "--connect"], interval: 5s, retries: 30 }
    volumes: [db:/var/lib/mysql]

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  configurator:
    <<: *frappe
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: "no"
    environment:
      DB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
    entrypoint: [bash, -c]
    command:
      - |
        set -e
        ls -1 apps > sites/apps.txt
        bench set-config -g db_host db; bench set-config -gp db_port 3306
        bench set-config -g redis_cache redis://redis:6379/0
        bench set-config -g redis_queue redis://redis:6379/1
        bench set-config -g redis_socketio redis://redis:6379/1
        bench set-config -gp socketio_port 9000
        if [ ! -f sites/${SITE}/site_config.json ]; then
          wait-for-it -t 120 db:3306
          bench new-site ${SITE} --mariadb-user-host-login-scope=% --db-root-password "${DB_ROOT_PASSWORD}" --admin-password "${ADMIN_PASSWORD}" --install-app linhx_worker --set-default
        else
          bench --site ${SITE} migrate
        fi
        bench --site ${SITE} set-config host_name ${PUBLIC_URL}
        bench --site ${SITE} enable-scheduler
        for s in linhx ifagent; do
          if [ -f "deploy/sites/$$s.json" ]; then
            wait-for-it -t 120 db:3306
            ./env/bin/python -m linhx_cli tao-site "$$s" --cau-hinh "deploy/sites/$$s.json" --sites-dir sites --bench-dir /home/frappe/frappe-bench
            bench --site "$$s" enable-scheduler
          fi
        done
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }

  backend:
    <<: *frappe
    # Bang tho (/#/engine) doc .canh/phieu.tsv, dang-chay.json; vong dieu phoi may cty scp len ~/linhx-engine/.canh
    volumes: [sites:/home/frappe/frappe-bench/sites, logs:/home/frappe/frappe-bench/logs, ../.canh:/home/frappe/frappe-bench/.canh:ro]
    depends_on: { configurator: { condition: service_completed_successfully } }

  websocket:
    <<: *frappe
    command: [node, /home/frappe/frappe-bench/apps/frappe/socketio.js]
    depends_on: { configurator: { condition: service_completed_successfully } }

  queue:
    <<: *frappe
    command: [bench, worker, --queue, "long,default,short"]
    depends_on: { configurator: { condition: service_completed_successfully } }

  scheduler:
    <<: *frappe
    command: [bench, schedule]
    depends_on: { configurator: { condition: service_completed_successfully } }

  frontend:
    <<: *frappe
    command: [nginx-entrypoint.sh]
    environment: { BACKEND: "backend:8000", SOCKETIO: "websocket:9000", FRAPPE_SITE_NAME_HEADER: "${SITE}", UPSTREAM_REAL_IP_ADDRESS: "0.0.0.0/0", UPSTREAM_REAL_IP_RECURSIVE: "on" }
    depends_on: [backend, websocket]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { SITE_ADDR: "${SITE_ADDR}" }
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, ../front:/srv/front:ro, ../trang-bu/out:/srv/ifagent:ro, caddy:/data]
    depends_on: [frontend]

  # Tho agy tren cloud (tuy chon). Bat bang: docker compose --profile tho-cloud up -d
  tho-cloud:
    profiles: [tho-cloud]
    build: { context: .., dockerfile: deploy/Dockerfile.tho }
    restart: unless-stopped
    environment:
      LINHX_URL: http://frontend:8080
      LINHX_TOKEN: "${THO_CLOUD_TOKEN}"
      LINHX_THO: cloud-1
      AGY_CMD: "${AGY_CMD:-agy}"
      AGY_ARGS: "--output-format json"
    volumes: [agy-home:/root/.gemini, tho-viec:/tho/viec]
    depends_on: [frontend]

volumes: { db: {}, sites: {}, logs: {}, caddy: {}, agy-home: {}, tho-viec: {} }
