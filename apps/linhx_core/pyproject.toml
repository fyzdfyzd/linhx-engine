[project]
name = "linhx_core"
authors = [{ name = "LINHX", email = "dev@linhx.vn" }]
description = "LINHX ENGINE: khung app Frappe linhx_core (crm, pay)"
requires-python = ">=3.10"
readme = "README.md"
version = "0.1.0"
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["linhx_core*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.html", "*.txt"]
