name: linhx-engine

on:
  push:
    branches:
      - main
      - "tu-dong/*"
  pull_request:
    branches:
      - main

jobs:
  kiem:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest and Playwright Chromium
        run: |
          python -m pip install pytest playwright
          python -m playwright install --with-deps chromium

      - name: Setup Node.js cho trang-bu
        if: hashFiles('trang-bu/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: trang-bu/package-lock.json

      - name: Install dependencies trang-bu
        if: hashFiles('trang-bu/package.json') != ''
        working-directory: trang-bu
        run: npm ci

      - name: Chạy cổng kiểm (tests/nghiem-thu)
        run: |
          loi=0
          for f in features-dot*.json; do
            echo "=== Kiểm $f ==="
            python canh/cong_kiem.py kiem "$f" || loi=1
            git checkout -- "$f"
            rm -f KIEM-*.json
          done
          exit "$loi"
