name: linhx-engine

on:
  push:
    branches:
      - main
      - "tu-dong/*"
  pull_request:
    branches:
      - main

jobs:
  kiem:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Chạy cổng kiểm (tests/nghiem-thu)
        run: |
          python -m pytest tests/nghiem-thu/test_n1.py -k "not test_ci_xanh_co_bang_chung" -q
          for f in features-dot1*.json; do
            python canh/cong_kiem.py kiem "$f"
          done
