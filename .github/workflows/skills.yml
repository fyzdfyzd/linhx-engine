name: skills

on:
  push:
    paths: ["skills/**", "scripts/skill_*.py", "scripts/test_skill_ban.py", ".claude-plugin/**", ".github/workflows/skills.yml"]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths: ["skills/**", "scripts/skill_*.py", "scripts/test_skill_ban.py", ".claude-plugin/**", ".github/workflows/skills.yml"]

jobs:
  kiem-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # kiem tang ban can so voi main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml pytest
      - name: Tự kiểm bộ kiểm phiên bản
        run: python -m pytest scripts/test_skill_ban.py -q -p no:cacheprovider
      - name: Kiểm skill (frontmatter, tên trùng, bí mật, file nặng)
        run: python scripts/skill_kiem.py
      - name: Kiểm phiên bản (SemVer, CHANGELOG, YAML, marketplace, có sửa phải tăng bản)
        env:
          LINHX_KHONG_TANG: ${{ contains(github.event.pull_request.labels.*.name, 'khong-tang-ban') && '1' || '0' }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/skill_ban.py kiem --base "origin/${{ github.base_ref }}"
          else
            python scripts/skill_ban.py kiem
          fi
      - name: INDEX.md phải khớp skill thật
        run: |
          python scripts/skill_kiem.py --index
          git diff --exit-code skills/INDEX.md skills/danh-muc.json

  phat-hanh:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: kiem-skill
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: skills-phat-hanh
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gắn tag <ten>@<bản> cho đơn vị vừa lên bản
        run: |
          git config user.name "linhx-skills"
          git config user.email "linhx-skills@users.noreply.github.com"
          python scripts/skill_ban.py phat-hanh --day
